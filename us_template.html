<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a0f">
<title>AK 미국 패턴 터미널</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#06090d; --panel:#0b1016; --panel-2:#0f161e; --line:#1a2430; --line-2:#243241;
  --ink:#d9e1ea; --ink-2:#a3b0bf; --muted:#66768a;
  --acc:#f5a524; --acc-soft:rgba(245,165,36,.12);
  --up:#ef4444; --dn:#3b82f6;                      /* 한국식: 상승 빨강 · 하락 파랑 (버튼으로 미국식 전환) */
  --good:#22c55e; --bad:#ef4444; --cyan:#38bdf8; --violet:#a78bfa; --yellow:#facc15;
  --mono:"JetBrains Mono",D2Coding,Consolas,"Malgun Gothic","Apple SD Gothic Neo",monospace;
}
:root[data-color="us"]{ --up:#22c55e; --dn:#ef4444; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.up{color:var(--up)} .dn{color:var(--dn)} .muted{color:var(--muted)} .acc{color:var(--acc)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 바 */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 16px;background:#080c11;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#f5a524 0 38%,#3a2606 40% 58%,#f5a524 60%);flex:none}
.logo b{font-size:15px;letter-spacing:.06em;font-weight:800;white-space:nowrap}
.logo small{display:block;font-size:10.5px;color:var(--acc);letter-spacing:.08em;white-space:nowrap}
.badge{font-size:10.5px;border:1px solid var(--acc);color:var(--acc);padding:2px 7px;border-radius:3px;letter-spacing:.05em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);padding:4px 10px;border-radius:3px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.cmd{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);padding:6px 10px;border-radius:3px;min-width:160px}
.cmd span{color:var(--acc);font-weight:700}
.cmd input{flex:1;background:transparent;border:0;outline:0;min-width:0}
.cmd kbd{font-size:10px;color:var(--muted);border:1px solid var(--line-2);padding:1px 5px;border-radius:3px}
.topr{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--good);white-space:nowrap}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:5px 10px;border-radius:3px;cursor:pointer;font-size:11.5px;color:var(--ink-2);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc);color:var(--acc)}

/* 왼쪽 레일 */
.shell{display:grid;grid-template-columns:64px 1fr;min-height:calc(100vh - 51px)}
.rail{border-right:1px solid var(--line);background:#080c11;display:flex;flex-direction:column;gap:2px;padding-top:10px;position:sticky;top:51px;height:calc(100vh - 51px)}
.rail button{border:0;background:none;padding:12px 0;cursor:pointer;color:var(--muted);font-size:10.5px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:4px;border-left:2px solid transparent}
.rail button[aria-pressed="true"]{color:var(--acc);border-left-color:var(--acc);background:var(--acc-soft)}
.rail .clock{margin-top:auto;padding:12px 0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--acc);align-self:center}
main{min-width:0;padding:14px 16px 40px}
.view{display:none} .view.on{display:block}

/* 패널 공통 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:14px;color:var(--acc);letter-spacing:.06em}
.ph .sub{font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line-2);background:transparent;padding:6px 14px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#3a2606;color:var(--acc);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.st{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.st:nth-child(4n){border-right:0}
.st .l{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.st .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.st .n{font-size:10.5px;color:var(--muted)}

/* 훑기 3단 */
.scan{display:grid;grid-template-columns:230px minmax(0,1fr) 430px;gap:12px;margin-top:12px;align-items:start}
.filters{position:sticky;top:63px;max-height:calc(100vh - 75px);overflow:auto}
.fsec{padding:10px 12px;border-bottom:1px solid var(--line)}
.fsec h4{margin:0 0 8px;font-size:10.5px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.fsec input[type=search]{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:7px 9px;outline:0}
.fsec input[type=search]:focus{border-color:var(--acc)}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--ink-2);cursor:pointer}
.ck input{accent-color:var(--acc);margin:0}
.ck em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.listh{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listh b{font-size:12.5px}
.listh select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:5px 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:10px}
.card{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:10px 12px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--line-2)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ch{display:flex;gap:10px;align-items:flex-start}
.rk{border:1px solid var(--line-2);border-radius:3px;padding:2px 6px;font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.rk b{display:block;color:var(--acc);font-size:11px}
.tk{font-size:15px;font-weight:800;letter-spacing:.02em}
.nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.stb{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid;white-space:nowrap}
.stb.confirmed{color:var(--good);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.stb.retest{color:var(--violet);border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.08)}
.stb.forming{color:var(--yellow);border-color:rgba(250,204,21,.45);background:rgba(250,204,21,.07)}
.stb.target{color:var(--cyan);border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.08)}
.stb.none{color:var(--muted);border-color:var(--line-2)}
.pl{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;font-size:12px;font-weight:700}
.pl .q{font-size:10.5px;color:var(--muted);font-weight:400}
.bull{color:var(--up)} .bear{color:var(--dn)} .neutral{color:var(--ink-2)}
.mini{height:120px}
.mini svg,.big svg{display:block;width:100%}
.kv{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:6px;padding-top:6px;text-align:center}
.kv .l{font-size:9.5px;color:var(--muted);letter-spacing:.05em}
.kv .v{font-size:11.5px;font-weight:700;white-space:nowrap}
.cf{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:6px;gap:6px}
.star{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.star.on{color:var(--acc)}
.more{display:block;width:calc(100% - 20px);margin:0 10px 12px;padding:9px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:3px}

/* 상세 */
.detail{position:sticky;top:63px;max-height:calc(100vh - 75px);overflow:auto}
.dtiles{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.dtiles div{padding:7px 8px;border-right:1px solid var(--line);min-width:0}
.dtiles div:last-child{border-right:0}
.dtiles .l{font-size:9.5px;color:var(--muted);white-space:nowrap} .dtiles .v{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.pchip{border:1px solid var(--line-2);background:transparent;padding:4px 8px;border-radius:3px;font-size:11px;cursor:pointer;color:var(--ink-2)}
.pchip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.dh h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.dsec{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.7}
.dsec h4{margin:0 0 6px;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.grid2 span:nth-child(even){text-align:right;color:var(--ink);font-weight:600}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);padding:0 12px}
.lg i{display:inline-block;width:12px;height:2px;vertical-align:3px;margin-right:4px}

/* 시장·실적 */
.mgrid{display:grid;gap:12px}
.tiles6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{padding:10px 12px}
.tile .l{font-size:10.5px;color:var(--muted)} .tile .v{font-size:18px;font-weight:800} .tile .c{font-size:11.5px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10.5px;color:var(--muted);font-weight:600;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);letter-spacing:.04em;white-space:nowrap}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr:hover td{background:var(--panel-2)}
tr.click{cursor:pointer}
.tw{overflow-x:auto}
.mgrid>*,.tiles6>*,.c2>*,.c3>*{min-width:0}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc)}
.eday{padding:9px 12px;font-size:12px;color:var(--acc);border-bottom:1px solid var(--line);background:#0a0f15;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
#tip{position:fixed;pointer-events:none;z-index:60;background:#0b1016;border:1px solid var(--line-2);padding:7px 9px;font-size:11px;display:none;min-width:150px}
#tip .t{color:var(--acc);margin-bottom:3px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
footer{color:var(--muted);font-size:10.5px;margin-top:16px;line-height:1.7}

@media (max-width:1400px){ .scan{grid-template-columns:210px minmax(0,1fr) 380px} }
@media (max-width:1150px){
  .scan{grid-template-columns:200px minmax(0,1fr)} .detail{grid-column:1/-1;position:static;max-height:none}
  .tiles6{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .top{flex-wrap:wrap} .cmd{order:5;flex-basis:100%} .hide-m{display:none}
  .shell{grid-template-columns:1fr} .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:40;border-right:0;border-top:1px solid var(--line);padding:0}
  .rail button{flex:1;border-left:0;border-top:2px solid transparent} .rail button[aria-pressed="true"]{border-top-color:var(--acc)} .rail .clock{display:none}
  main{padding:10px 10px 80px}
  .scan{grid-template-columns:1fr} .filters{position:static;max-height:none}
  .stats{grid-template-columns:1fr 1fr} .st:nth-child(2n){border-right:0}
  .c2,.c3{grid-template-columns:1fr} .tiles6{grid-template-columns:1fr 1fr} .dtiles{grid-template-columns:repeat(3,1fr)}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-scan" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-mkt" viewBox="0 0 24 24"><path d="M3 20h18M6 16v-5M10 16V8M14 16v-3M18 16V5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
</svg>

<header class="top">
  <div class="logo"><div class="dot"></div><div><b>AK//US 패턴</b><small>미국 주식 패턴 터미널</small></div></div>
  <span class="badge hide-m">빌드 1.0 · 매일</span>
  <span class="chip hide-m"><i></i>장 마감 일봉 · 미국</span>
  <label class="cmd"><span>명령&gt;</span><input id="cmd" placeholder="티커 · 회사 · 패턴 (예: NVDA, Apple, 이중 바닥)" autocomplete="off"><kbd>Enter</kbd></label>
  <div class="topr">
    <span class="hide-m" id="topdate"></span>
    <button class="btn" id="colorbtn" title="상승·하락 색 바꾸기"></button>
    <a class="btn" href="./">롱숏 보드 ↗</a>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail">
    <button data-v="scan" aria-pressed="true"><svg class="i"><use href="#i-scan"/></svg>훑기</button>
    <button data-v="watch" aria-pressed="false"><svg class="i"><use href="#i-star"/></svg>관심</button>
    <button data-v="mkt" aria-pressed="false"><svg class="i"><use href="#i-mkt"/></svg>시장</button>
    <button data-v="earn" aria-pressed="false"><svg class="i"><use href="#i-cal"/></svg>실적</button>
    <div class="clock" id="clock"></div>
  </nav>
  <main>
    <!-- 훑기 / 관심 -->
    <section class="view on" id="v-scan">
      <div class="panel">
        <div class="ph">
          <div><h2 id="scantitle">종목 훑기 // 패턴</h2><div class="sub">시가총액 순 · 수정주가 · 종가 기준</div></div>
          <div class="seg" id="topn"><button data-n="50">50</button><button data-n="100">100</button><button data-n="200">200</button><button data-n="500" aria-pressed="true">500</button></div>
          <div class="sub" id="scanstate"></div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="scan">
        <aside class="panel filters" id="filters"></aside>
        <section class="panel" style="min-width:0">
          <div class="listh"><b id="listcount"></b>
            <label class="sub">정렬 <select id="sort">
              <option value="rank">시가총액 순</option><option value="q">패턴 품질 순</option><option value="rr">손익비 순</option>
              <option value="chg1">1일 등락 순</option><option value="chg5">5일 등락 순</option><option value="vr">거래량 급증 순</option></select></label>
          </div>
          <div class="cards" id="cards"></div>
          <button class="more" id="more" hidden>더 보기</button>
        </section>
        <aside class="panel detail" id="detail"></aside>
      </div>
    </section>

    <!-- 시장 -->
    <section class="view" id="v-mkt">
      <div class="mgrid">
        <div class="panel"><div class="ph"><h2>미국 시장 // 요약</h2><div class="sub" id="mktsub"></div></div><div class="tiles6" id="idx" style="padding:10px"></div></div>
        <div class="c2">
          <div class="panel"><div class="ph"><h2>섹터 강약</h2><div class="sub">SPDR 섹터 상장지수펀드</div></div><div class="tw"><table id="sectbl"></table></div></div>
          <div class="panel"><div class="ph"><h2>시장 폭</h2><div class="sub">시총 상위 500 기준</div></div><div id="breadth" style="padding:12px"></div>
            <div class="ph" style="border-top:1px solid var(--line)"><h2>금리 · 달러 · 원자재</h2></div><div class="tw"><table id="macro"></table></div></div>
        </div>
        <div class="c3">
          <div class="panel"><div class="ph"><h2>1일 상승 상위</h2></div><div class="tw"><table id="gain1"></table></div></div>
          <div class="panel"><div class="ph"><h2>1일 하락 상위</h2></div><div class="tw"><table id="lose1"></table></div></div>
          <div class="panel"><div class="ph"><h2>거래량 급증</h2><div class="sub">20일 평균 대비</div></div><div class="tw"><table id="volx"></table></div></div>
        </div>
      </div>
    </section>

    <!-- 실적 -->
    <section class="view" id="v-earn">
      <div class="panel">
        <div class="ph"><h2>실적 발표 일정</h2><div class="sub" id="earnsub"></div>
          <div class="seg" id="earnf"><button data-f="all" aria-pressed="true">전체</button><button data-f="watch">관심 종목</button><button data-f="pat">패턴 있는 종목</button></div></div>
        <div id="earn"></div>
      </div>
    </section>

    <footer>© 2026 Alex Ku. 이 사이트의 모든 권리는 Alex Ku에게 있습니다.</footer>
  </main>
</div>
<div id="tip"></div>

<script>
const D = /*__US__*/null;
const S = D ? D.stocks : [];
const DATES = D ? D.dates : [];
const bySym = Object.fromEntries(S.map(s=>[s.s,s]));
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v,d=2) => v==null||isNaN(v)?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (v,d=2) => v==null?'—':'$'+num(v,d);
const pct = (v,d=2) => v==null||isNaN(v)?'—':(v>0?'+':'')+(v*100).toFixed(d)+'%';
const cls = v => v>0?'up':v<0?'dn':'';
const cp = (v,d=2) => `<span class="${cls(v)}">${pct(v,d)}</span>`;
const mcap = v => v==null?'—':v>=1e12?`${(v/1e12).toFixed(2)}조 달러`:`${Math.round(v/1e8).toLocaleString('ko-KR')}억 달러`;
const md = d => d?`${+d.slice(5,7)}/${+d.slice(8,10)}`:'';
const WD='일월화수목금토', dayLabel = d => `${md(d)}(${WD[new Date(d+'T12:00:00Z').getUTCDay()]})`;
const ST={confirmed:'돌파 확정',retest:'되돌림',forming:'형성 중',target:'목표 도달'};
const BIAS={bull:'상승',bear:'하락',neutral:'중립'};
const side = pt => !pt?'':pt.bias==='bear'?'숏 ':pt.bias==='bull'?'롱 ':'';
const qLabel = q => q>=85?'교과서':q>=72?'양호':'보통';

const LINE={res:['var(--acc)','5 4'],sup:['var(--cyan)','5 4'],neck:['var(--acc)',''],pole:['var(--muted)','2 3'],curve:['var(--violet)','']};
function candles(box,s,{height=120,pat=null,big=false,mode='candle'}={}){
  const W=box.clientWidth||300, n=DATES.length;
  const volH=big?60:18, rsiH=big?64:0, gap=big?8:2;
  const m={t:big?10:4,r:big?80:4,b:big?18:2,l:big?4:4};
  const H=height, pH=H-m.t-m.b-volH-gap-(rsiH?rsiH+gap:0);
  const vals=[]; for(let i=0;i<n;i++){ if(s.h[i]!=null){vals.push(s.h[i],s.l[i]);} }
  if(!vals.length){ box.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const lv=pat?[pat.target,pat.stop,pat.level].filter(v=>v!=null):[];
  let lo=Math.min(...vals), hi=Math.max(...vals);
  lv.forEach(v=>{ if(v<hi*1.35&&v>lo*0.7){ lo=Math.min(lo,v); hi=Math.max(hi,v);} });
  const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const step=(W-m.l-m.r)/n, x=i=>m.l+(i+.5)*step, y=v=>m.t+pH*(1-(v-lo)/(hi-lo));
  const cw=Math.max(1,step*.62);
  let g='';
  if(big){ for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-m.r+6}" y="${y(v)+3}" font-size="9.5" fill="var(--muted)">${num(v,v>=100?0:2)}</text>`; }
    for(let i=0;i<n;i+=21) g+=`<text x="${x(i)}" y="${H-4}" font-size="9.5" fill="var(--muted)" text-anchor="middle">${md(DATES[i])}</text>`; }
  // 이동평균
  const ml=(arr,c,w)=>{ let d='',pen=false; arr.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); pen=true; }); return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`:''; };
  if(big){ g+=ml(s.ma20,'var(--yellow)',1.1)+ml(s.ma50,'var(--cyan)',1.1)+ml(s.ma200,'var(--violet)',1.3); }
  // 가격
  if(mode==='line'){ g+=ml(s.c,'var(--ink)',1.6); }
  else for(let i=0;i<n;i++){ if(s.o[i]==null) continue; const up=s.c[i]>=s.o[i], col=up?'var(--up)':'var(--dn)';
    g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(s.h[i])}" y2="${y(s.l[i])}" stroke="${col}" stroke-width="1"/>`;
    const a=y(Math.max(s.o[i],s.c[i])), b=y(Math.min(s.o[i],s.c[i]));
    g+=`<rect x="${x(i)-cw/2}" y="${a}" width="${cw}" height="${Math.max(1,b-a)}" fill="${up?'transparent':col}" stroke="${col}" stroke-width="1"/>`; }
  // 패턴 선·수준
  if(pat){
    pat.lines.forEach(([a,y1,b,y2,k])=>{ const [c,dash]=LINE[k]||LINE.res; g+=`<line x1="${x(a)}" y1="${y(y1)}" x2="${x(b)}" y2="${y(y2)}" stroke="${c}" stroke-width="${big?1.6:1.2}" ${dash?`stroke-dasharray="${dash}"`:''}/>`; });
    pat.pts.forEach(([a,v,t])=>{ g+=`<circle cx="${x(a)}" cy="${y(v)}" r="${big?3.5:2.2}" fill="none" stroke="var(--acc)" stroke-width="1.4"/>`+(big?`<text x="${x(a)}" y="${y(v)+(t==='H'||t==='머리'&&pat.bias==='bear'?-7:13)}" font-size="9.5" fill="var(--acc)" text-anchor="middle">${esc(t==='H'||t==='L'?'':t)}</text>`:''); });
    const hl=(v,c,lab)=>{ if(v==null||v<lo||v>hi) return; g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="3 3" stroke-width="1"/>`;
      if(big) g+=`<rect x="${W-m.r+2}" y="${y(v)-8}" width="${Math.max(m.r-4,lab.length*10+8)}" height="16" fill="var(--panel)" stroke="${c}" stroke-width=".8"/><rect x="${W-m.r+2}" y="${y(v)-8}" width="${Math.max(m.r-4,lab.length*10+8)}" height="16" fill="${c}" opacity=".16"/><text x="${W-m.r+6}" y="${y(v)+4}" font-size="10" font-weight="700" fill="${c}">${lab}</text>`; };
    hl(pat.target,'var(--good)',side(pat)+(pat.st==='target'?'목표✓':'목표')); hl(pat.stop,'var(--bad)',side(pat)+'손절'); if(pat.level) hl(pat.level,'var(--acc)','돌파선');
  }
  // 거래량
  const vmax=Math.max(1,...s.v.filter(v=>v!=null)), vy=m.t+pH+gap;
  for(let i=0;i<n;i++){ if(s.v[i]==null) continue; const hh=volH*s.v[i]/vmax; const up=s.c[i]>=s.o[i];
    g+=`<rect x="${x(i)-cw/2}" y="${vy+volH-hh}" width="${cw}" height="${hh}" fill="${up?'var(--up)':'var(--dn)'}" opacity=".35"/>`; }
  // RSI
  if(rsiH){ const ry=vy+volH+gap, rv=rsiSeries(s.c);
    g+=`<rect x="${m.l}" y="${ry}" width="${W-m.l-m.r}" height="${rsiH}" fill="none" stroke="var(--line)"/>`;
    [30,70].forEach(t=>g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${ry+rsiH*(1-t/100)}" y2="${ry+rsiH*(1-t/100)}" stroke="var(--line-2)" stroke-dasharray="2 3"/><text x="${W-m.r+6}" y="${ry+rsiH*(1-t/100)+3}" font-size="9" fill="var(--muted)">${t}</text>`);
    let d='',pen=false; rv.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+','+(ry+rsiH*(1-v/100)).toFixed(1); pen=true; });
    g+=`<path d="${d}" fill="none" stroke="var(--violet)" stroke-width="1.2"/><text x="${m.l+4}" y="${ry+11}" font-size="9.5" fill="var(--muted)">RSI 14</text>`; }
  box.innerHTML=`<svg height="${H}" viewBox="0 0 ${W} ${H}">${g}${big?`<line class="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--line-2)" style="display:none"/><rect class="hit" x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent"/>`:''}</svg>`;
  if(big){ const svg=box.querySelector('svg'), xh=svg.querySelector('.xh');
    svg.querySelector('.hit').addEventListener('mousemove',e=>{ const r=svg.getBoundingClientRect(); const i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-m.l)/step)));
      xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.display='';
      if(s.c[i]==null) return; const ch=i>0&&s.c[i-1]?s.c[i]/s.c[i-1]-1:null;
      showTip(e,DATES[i],[['시가',usd(s.o[i])],['고가',usd(s.h[i])],['저가',usd(s.l[i])],['종가',usd(s.c[i])],['등락',cp(ch)],['거래량',num(s.v[i],0)]]); });
    svg.querySelector('.hit').addEventListener('mouseleave',()=>{ xh.style.display='none'; hideTip(); }); }
}
function rsiSeries(c,n=14){ const out=c.map(()=>null); let g=0,l=0,k=0,prev=null,started=false;
  for(let i=0;i<c.length;i++){ if(c[i]==null) continue; if(prev==null){prev=c[i];continue;} const d=c[i]-prev; prev=c[i]; k++;
    if(k<=n){ g+=Math.max(d,0); l+=Math.max(-d,0); if(k===n){ g/=n; l/=n; started=true; out[i]=l?100-100/(1+g/l):100; } }
    else { g=(g*(n-1)+Math.max(d,0))/n; l=(l*(n-1)+Math.max(-d,0))/n; out[i]=l?100-100/(1+g/l):100; } }
  return out; }

function passes(s){
  if(s.r>F.topn) return false;
  if(F.onlyWatch && !WATCH.has(s.s)) return false;
  if(F.onlyPat && !s.pats.length) return false;
  if(F.q){ const q=F.q.toLowerCase(); if(!(s.s.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)||s.pats.some(p=>p.name.includes(F.q))||(s.sec||'').includes(F.q))) return false; }
  if(F.sec.size && !F.sec.has(s.sec)) return false;
  const ps=s.pats.filter(p=>(F.bias==='all'||p.bias===F.bias)&&(!F.st.size||F.st.has(p.st))&&(!F.fam.size||F.fam.has(p.fam))&&(!F.kind.size||F.kind.has(p.name)));
  if((F.bias!=='all'||F.st.size||F.fam.size||F.kind.size) && !ps.length) return false;
  return true;
}

    T('목표 도달',num(allp.filter(p=>p.st==='target').length,0),'패턴 높이만큼 움직임'),
    T('손익비 1 미만',`<span style="color:var(--bad)">${allp.filter(p=>p.rr!=null&&p.rr<1).length}</span>`,'남은 수익 < 남은 위험'),
    T('데이터 기준',D.data_date,'미국 장 마감 종가','acc'),
  ].join('');
  $('scanstate').textContent=`완료 · ${sub.length}/${Math.min(F.topn,st.universe)} 받음 · 패턴 ${allp.length}개 · 수집 ${new Date(D.captured_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`;
}
function sortVal(s){ const p=prim(s);
  switch(F.sort){ case 'q': return p?-p.q:1e9; case 'rr': return p&&p.rr!=null?-p.rr:1e9; case 'chg1': return -(s.chg1??-9); case 'chg5': return -(s.chg5??-9); case 'vr': return -(s.vr??0); default: return s.r; } }
function renderList(){
  LIST=S.filter(passes).sort((a,b)=>sortVal(a)-sortVal(b));
  $('listcount').innerHTML=`${LIST.length}종목 <span class="muted" style="font-weight:400">· 패턴 ${LIST.filter(s=>s.pats.length).length} · ${F.onlyWatch?'관심 종목':'시가총액 상위 '+F.topn}</span>`;
  $('cards').innerHTML=''; shown=0; moreCards();
  if(!LIST.length) $('cards').innerHTML=`<div class="empty" style="grid-column:1/-1">${F.onlyWatch&&!WATCH.size?'관심 종목이 없어요. 카드의 ☆ 를 눌러 추가하세요.':'조건에 맞는 종목이 없어요.'}</div>`;
  if(!selSym || !LIST.find(s=>s.s===selSym)) { if(LIST[0]) select(LIST[0].s,0); }
  else renderDetail();
}
function card(s){ const p=prim(s);
  return `<div class="card ${s.s===selSym?'sel':''}" data-s="${esc(s.s)}">
    <div class="ch"><div class="rk">순위<b>#${s.r}</b></div><div style="min-width:0"><div class="tk">${esc(s.s)}</div><div class="nm" title="${esc(s.n)}">${esc(s.n)}</div></div>
      <span class="stb ${p?p.st:'none'}">${p?ST[p.st]:'패턴 없음'}</span></div>
    <div class="pl"><span class="${p?p.bias:'neutral'}">${p?`${p.bias==='bull'?'▲':p.bias==='bear'?'▼':'■'} ${esc(p.name)}`:'—'}</span><span class="q">${p?`${qLabel(p.q)} · ${p.q}`:''}</span></div>
    <div class="mini"></div>
    <div class="kv"><div><div class="l">종가</div><div class="v">${usd(s.last)}</div></div>
      <div><div class="l">${side(p)}목표</div><div class="v" style="color:var(--good)">${p?usd(p.target):'—'}</div></div>
      <div><div class="l">${side(p)}손절</div><div class="v" style="color:var(--bad)">${p?usd(p.stop):'—'}</div></div>
      <div><div class="l">손익비</div><div class="v">${p&&p.rr!=null?p.rr.toFixed(1):'—'}</div></div></div>
    <div class="cf"><span>${s.x==='NAS'?'나스닥':s.x==='NYS'?'뉴욕':'아멕스'} · ${mcap(s.mc)} · ${esc(s.sec||'')}</span>
      <span>${cp(s.chg1)} <button class="star ${WATCH.has(s.s)?'on':''}" data-w="${esc(s.s)}" title="관심 종목">${WATCH.has(s.s)?'★':'☆'}</button></span></div></div>`; }
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const el=e.target; io.unobserve(el); const s=bySym[el.closest('.card').dataset.s]; candles(el,s,{height:120,pat:prim(s)}); } }),{rootMargin:'300px'});
function moreCards(){
  const chunk=LIST.slice(shown,shown+PAGE); shown+=chunk.length;
  $('cards').insertAdjacentHTML('beforeend',chunk.map(card).join(''));
  [...$('cards').querySelectorAll('.card')].slice(-chunk.length).forEach(c=>{
    c.onclick=e=>{ if(e.target.closest('.star')) return; select(c.dataset.s,0); };
    c.querySelector('.star').onclick=e=>{ e.stopPropagation(); toggleWatch(c.dataset.s); const on=WATCH.has(c.dataset.s); e.target.classList.toggle('on',on); e.target.textContent=on?'★':'☆'; if(F.onlyWatch) renderList(); renderFilters(); if(selSym===c.dataset.s) renderDetail(); };
    io.observe(c.querySelector('.mini')); });
  $('more').hidden=shown>=LIST.length; $('more').textContent=`더 보기 (${LIST.length-shown}종목 남음)`;
}
$('more').onclick=moreCards;
function select(sym,pi){ selSym=sym; selPat=pi;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.s===sym)); renderDetail(); }
function renderDetail(){
  const s=bySym[selSym], el=$('detail'); if(!s){ el.innerHTML='<div class="empty">종목을 고르세요.</div>'; return; }
  const p=s.pats[selPat]||null, er=(D.earnings||[]).find(e=>e.s===s.s);
  el.innerHTML=`
    <div class="dtiles"><div><div class="l">종가</div><div class="v">${usd(s.last)}</div></div><div><div class="l">1일</div><div class="v">${cp(s.chg1)}</div></div>
      <div><div class="l">시가총액</div><div class="v">${mcap(s.mc)}</div></div><div><div class="l">RSI 14</div><div class="v ${s.rsi>=70?'up':s.rsi<=30?'dn':''}">${s.rsi??'—'}</div></div>
      <div><div class="l">품질</div><div class="v acc">${p?p.q+'/100':'—'}</div></div></div>
    <div class="pchips">${s.pats.map((x,i)=>`<button class="pchip" data-i="${i}" aria-pressed="${i===selPat}">${esc(x.name)} ${x.q}</button>`).join('')||'<span class="muted" style="font-size:11px">찾은 패턴 없음</span>'}</div>
    <div class="dh"><h3><span class="tk">${esc(s.s)}</span><span class="${p?p.bias:''}">${p?esc(p.name):'차트'}</span>${p?`<span class="stb ${p.st}">${ST[p.st]}</span>`:''}</h3>
      <div class="seg" id="dmode"><button data-m="candle" aria-pressed="${detailMode==='candle'}">캔들</button><button data-m="line" aria-pressed="${detailMode==='line'}">선</button></div></div>
    <div class="lg"><span><i style="background:var(--yellow)"></i>20일선</span><span><i style="background:var(--cyan)"></i>50일선</span><span><i style="background:var(--violet)"></i>200일선</span>${p?`<span><i style="background:var(--good)"></i>${side(p)}목표</span><span><i style="background:var(--bad)"></i>${side(p)}손절</span><span><i style="background:var(--acc)"></i>돌파선·목선</span>`:''}</div>
    <div class="big" id="bigchart" style="padding:4px 4px 0 8px"></div>
    ${p?`<div class="dsec"><h4>패턴 해설 · ${esc(p.fam)} · ${BIAS[p.bias]}${p.bias==='bear'?' (숏 관점)':p.bias==='bull'?' (롱 관점)':''}</h4>${DESC[p.k]||''}${p.st==='target'?' <b style="color:var(--acc)">이미 목표가에 도달한 패턴이에요. 새로 들어갈 자리가 아니라 지나간 신호로 보세요.</b>':p.bias==='bear'?' <b style="color:var(--ink)">하락(숏) 관점이라 목표가는 아래, 손절가는 위예요.</b>':''}
      <div class="grid2" style="margin-top:8px"><span>${side(p)}목표가</span><span style="color:var(--good)">${usd(p.target)} (${pct(p.target/s.last-1,1)})</span>
      <span>${side(p)}손절가</span><span style="color:var(--bad)">${usd(p.stop)} (${pct(p.stop/s.last-1,1)})</span>
      ${p.level?`<span>돌파선</span><span>${usd(p.level)}</span>`:''}<span>손익비</span><span>${p.rr!=null?p.rr.toFixed(2):'—'}</span>
      <span>돌파 거래량</span><span>${p.vol?'평균의 1.5배 이상 ✓':'—'}</span><span>품질</span><span>${qLabel(p.q)} · ${p.q}</span></div></div>`:''}
    <div class="dsec"><h4>종목 정보</h4><div class="grid2">
      <span>회사</span><span>${esc(s.n)}</span><span>섹터 · 업종</span><span title="${esc(s.ind)}">${esc(s.sec||'—')}</span>
      <span>5일 · 20일 · 60일</span><span>${cp(s.chg5,1)} · ${cp(s.chg20,1)} · ${cp(s.chg60,1)}</span>
      <span>52주 고가 · 저가</span><span>${usd(s.hi52)} · ${usd(s.lo52)}</span>
      <span>고가 대비</span><span>${pct(s.last/s.hi52-1,1)}</span>
      <span>거래량 (20일 평균 대비)</span><span>${s.vr!=null?s.vr.toFixed(2)+'배':'—'}</span>
      <span>50일선 · 200일선</span><span>${s.above50?'위':'아래'} · ${s.above200?'위':'아래'}</span>
      <span>실적 발표</span><span>${er?`${dayLabel(er.date)} ${er.time}`:'2주 안 없음'}</span></div>
      <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="dstar">${WATCH.has(s.s)?'★ 관심 종목 빼기':'☆ 관심 종목 담기'}</button>
        <a class="btn" href="https://finance.yahoo.com/quote/${encodeURIComponent(s.s.replace('/','-'))}" target="_blank" rel="noopener noreferrer">야후 파이낸스 ↗</a></div></div>`;
  el.querySelectorAll('.pchip').forEach(b=>b.onclick=()=>{ selPat=+b.dataset.i; renderDetail(); });
  el.querySelectorAll('#dmode button').forEach(b=>b.onclick=()=>{ detailMode=b.dataset.m; renderDetail(); });
  $('dstar').onclick=()=>{ toggleWatch(s.s); renderDetail(); renderFilters(); const st=document.querySelector(`.card[data-s="${CSS.escape(s.s)}"] .star`); if(st){ st.classList.toggle('on',WATCH.has(s.s)); st.textContent=WATCH.has(s.s)?'★':'☆'; } };
  candles($('bigchart'),s,{height:430,pat:p,big:true,mode:detailMode});
}
document.querySelectorAll('#topn button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#topn button').forEach(x=>x.setAttribute('aria-pressed',x===b)); F.topn=+b.dataset.n; renderStats(); renderFilters(); renderList(); });
$('sort').onchange=e=>{F.sort=e.target.value; renderList();};
$('cmd').addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const q=e.target.value.trim(); if(!q) return;
  const hit=S.find(s=>s.s.toLowerCase()===q.toLowerCase());
  go('scan'); F.q=hit?'':q; if(hit){ F.topn=500; document.querySelectorAll('#topn button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.n==='500')); }
  renderFilters(); renderList(); if(hit){ select(hit.s,0); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); } });

// ---------- 시장 ----------
function spark(arr,w=150,h=34){ const v=arr.filter(x=>x!=null); if(v.length<2) return ''; const lo=Math.min(...v),hi=Math.max(...v);
  const pts=arr.map((x,i)=>x==null?null:`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(x-lo)/((hi-lo)||1)*(h-4)).toFixed(1)}`).filter(Boolean).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${arr.at(-1)>=arr[0]?'var(--up)':'var(--dn)'}" stroke-width="1.6"/></svg>`; }
function renderMkt(){
  const I=D.indices||[];
  $('mktsub').textContent=`${D.data_date} 종가 · 시총 상위 ${S.length}종목`;
  $('idx').innerHTML=I.map(x=>`<div class="panel tile"><div class="l">${esc(x.name)}</div><div class="v">${num(x.last,2)}</div><div class="c">${cp(x.chg1)} <span class="muted" style="font-weight:400">5일 ${pct(x.chg5,1)}</span></div>${spark(x.series)}</div>`).join('')||'<div class="empty">지수 데이터 없음</div>';
  const SE=[...(D.sectors||[])].sort((a,b)=>(b.chg1??-9)-(a.chg1??-9));
  $('sectbl').innerHTML=`<thead><tr><th class="l">섹터</th><th>1일</th><th>5일</th><th>20일</th><th>60일</th><th>60일 흐름</th></tr></thead><tbody>`+
    SE.map(x=>`<tr class="click" data-sec="${esc(x.name)}"><td class="l">${esc(x.name)} <span class="muted">${x.s}</span></td><td>${cp(x.chg1)}</td><td>${cp(x.chg5,1)}</td><td>${cp(x.chg20,1)}</td><td>${cp(x.chg60,1)}</td><td style="width:110px">${spark(x.series,110,22)}</td></tr>`).join('')+'</tbody>';
  const st=D.stats, n=S.length, bar=(l,v,t,c='var(--acc)')=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${l}</span><b>${t}</b></div><div class="bar"><b style="width:${v*100}%;background:${c}"></b></div></div>`;
  $('breadth').innerHTML=bar('오른 종목 비율',st.adv/n,`${st.adv} / ${n}`,'var(--up)')+bar('50일선 위',st.above50/n,pct(st.above50/n,0).replace('+',''))+bar('200일선 위',st.above200/n,pct(st.above200/n,0).replace('+',''))+
    `<div class="grid2" style="font-size:12px"><span>52주 신고가 근처</span><span class="up">${st.new_hi}종목</span><span>52주 신저가 근처</span><span class="dn">${st.new_lo}종목</span></div>`;
  $('macro').innerHTML=`<thead><tr><th class="l">지표</th><th>값</th><th>1일</th><th>5일</th><th>20일</th></tr></thead><tbody>`+
    (D.macro||[]).map(g=>`<tr><td class="l">${esc(g.name)}</td><td>${num(g.price,2)}${g.unit==='%'?'%':''}</td><td>${cp(g.chg1)}</td><td>${cp(g.chg5,1)}</td><td>${cp(g.chg20,1)}</td></tr>`).join('')+'</tbody>';
  const row=s=>`<tr class="click" data-s="${esc(s.s)}"><td class="l"><b>${esc(s.s)}</b> <span class="muted">${esc(s.n.slice(0,18))}</span></td><td>${usd(s.last)}</td><td>${cp(s.chg1)}</td></tr>`;
  const head='<thead><tr><th class="l">종목</th><th>종가</th><th>1일</th></tr></thead><tbody>';
  const by=k=>[...S].filter(s=>s[k]!=null);
  $('gain1').innerHTML=head+by('chg1').sort((a,b)=>b.chg1-a.chg1).slice(0,12).map(row).join('')+'</tbody>';
  $('lose1').innerHTML=head+by('chg1').sort((a,b)=>a.chg1-b.chg1).slice(0,12).map(row).join('')+'</tbody>';
  $('volx').innerHTML='<thead><tr><th class="l">종목</th><th>배수</th><th>1일</th></tr></thead><tbody>'+by('vr').sort((a,b)=>b.vr-a.vr).slice(0,12).map(s=>`<tr class="click" data-s="${esc(s.s)}"><td class="l"><b>${esc(s.s)}</b> <span class="muted">${esc(s.n.slice(0,18))}</span></td><td>${s.vr.toFixed(1)}배</td><td>${cp(s.chg1)}</td></tr>`).join('')+'</tbody>';
  document.querySelectorAll('#v-mkt tr[data-s]').forEach(t=>t.onclick=()=>openSym(t.dataset.s));
  const SECMAP={'커뮤니케이션':'통신','기타':''};
  document.querySelectorAll('#sectbl tr[data-sec]').forEach(t=>t.onclick=()=>{ go('scan'); F.sec=new Set([SECMAP[t.dataset.sec]??t.dataset.sec]); renderFilters(); renderList(); });
}
function openSym(sym){ go('scan'); F.q=''; F.onlyWatch=false; F.topn=500; document.querySelectorAll('#topn button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.n==='500')); renderStats(); renderFilters(); renderList(); select(sym,0); $('detail').scrollIntoView({block:'start'}); }

// ---------- 실적 ----------
let earnF='all';
function renderEarn(){
  const E=(D.earnings||[]).filter(e=>earnF==='all'||(earnF==='watch'?WATCH.has(e.s):bySym[e.s]?.pats.length));
  $('earnsub').textContent=`앞으로 2주 · 시총 상위 ${S.length} 안 ${D.earnings?.length||0}건 · 미국 날짜 기준 (한국은 장 마감 후 발표가 다음 날 아침)`;
  const by={}; E.forEach(e=>(by[e.date]??=[]).push(e));
  $('earn').innerHTML=Object.entries(by).map(([d,list])=>`<div class="eday">${dayLabel(d)} · ${list.length}건</div><div class="tw"><table><thead><tr><th class="l">종목</th><th class="l">발표</th><th>분기</th><th>예상 EPS</th><th>전년 EPS</th><th>추정 수</th><th>시가총액</th><th class="l">패턴</th><th>1일</th></tr></thead><tbody>`+
    list.sort((a,b)=>(bySym[a.s]?.r||999)-(bySym[b.s]?.r||999)).map(e=>{ const s=bySym[e.s]||{}; const p=s.pats?.[0];
      return `<tr class="click" data-s="${esc(e.s)}"><td class="l"><b>${esc(e.s)}</b> <span class="muted">${esc((s.n||'').slice(0,22))}</span>${WATCH.has(e.s)?' <span class="acc">★</span>':''}</td><td class="l">${e.time}</td><td>${esc(e.q)}</td><td>${esc(e.eps_f||'—')}</td><td>${esc(e.eps_ly||'—')}</td><td>${esc(e.n_est||'—')}</td><td>${mcap(s.mc)}</td>
        <td class="l">${p?`<span class="${p.bias}">${esc(p.name)}</span> <span class="muted">${ST[p.st]}</span>`:'<span class="muted">—</span>'}</td><td>${cp(s.chg1)}</td></tr>`; }).join('')+'</tbody></table></div>').join('')
    || `<div class="empty">${earnF==='watch'?'관심 종목의 실적 발표 일정이 없어요.':'일정이 없어요.'}</div>`;
  document.querySelectorAll('#earn tr[data-s]').forEach(t=>t.onclick=()=>openSym(t.dataset.s));
}
document.querySelectorAll('#earnf button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#earnf button').forEach(x=>x.setAttribute('aria-pressed',x===b)); earnF=b.dataset.f; renderEarn(); });

// ---------- 화면 전환 ----------
function go(v){
  view=v; document.querySelectorAll('#rail button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  const tab=v==='watch'?'scan':v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+tab));
  if(v==='watch'||v==='scan'){ const w=v==='watch'; if(F.onlyWatch!==w){ F.onlyWatch=w; renderFilters(); renderList(); } $('scantitle').textContent=w?'관심 종목 // 패턴':'종목 훑기 // 패턴'; }
  if(v==='mkt') renderMkt();
  if(v==='earn') renderEarn();
  if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
}
document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>{ go(b.dataset.v); scrollTo({top:0}); });
function redraw(){ if(view==='scan'||view==='watch'){ document.querySelectorAll('.card .mini').forEach(m=>{ if(m.innerHTML){ const s=bySym[m.closest('.card').dataset.s]; candles(m,s,{height:120,pat:prim(s)}); } }); renderDetail(); } }
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(redraw,150); });

if(!D){ document.querySelector('main').innerHTML='<div class="empty">미국 데이터가 아직 없습니다. 다음 자동 업데이트(매일 아침 7시) 후 표시됩니다.</div>'; }
else {
  $('topdate').textContent=`데이터 ${D.data_date} · 수집 ${new Date(D.captured_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`;
  renderStats(); renderFilters(); renderList();
  go((location.hash||'#scan').slice(1).replace(/[^a-z]/g,'')||'scan');
}
</script>
</body>
</html>
