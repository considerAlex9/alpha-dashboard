name: 대시보드 자동 업데이트

on:
  schedule:
    # GitHub cron은 UTC 기준. 평일 09:10~16:10 KST 매시 10분 (장중 갱신 + 마감 후 확정값)
    - cron: "10 0-7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 수집 + 빌드
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
          COMPETITION_ID: "9"
        run: |
          python collect.py
          python build.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data index.html dashboard.html
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%F %H:%M') KST"
          git push
