name: 대시보드 자동 업데이트

on:
  # 정시 실행은 클라우드플레어 워커(ak-scheduler, scheduler/worker.js)가 깨운다 — 깃허브 예약은 자주 늦거나 빠져서 쓰지 않음
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼
  push:                   # 코드를 고치면 바로 한 번 돌려서 사이트에 반영
    branches: [main]
    paths: ["*.py", "template.html", "us_template.html", "sectors.json", "limits.json", "market_themes.json", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 수집 + 빌드
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 없으면 알림만 건너뜀
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPETITION_ID: "9"
        run: |
          pip install -q cryptography
          python collect.py
          python build.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data index.html dashboard.html us.html
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%F %H:%M') KST"
          # 실행 중에 코드가 새로 올라왔으면 먼저 합친 뒤 저장 (데이터 파일은 방금 받은 값을 우선)
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done
